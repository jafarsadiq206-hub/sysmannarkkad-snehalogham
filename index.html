<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SYS Mannarkkad Snehalokam</title>
  <style>
    body { font-family: sans-serif; background-color: #f0f2f5; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .container { background: #ffffff; padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); max-width: 450px; width: 100%; text-align: center; }
    #canvas-container { width: 100%; background-color: #ddd; border-radius: 12px; overflow: hidden; margin-bottom: 15px; touch-action: none; }
    canvas { width: 100%; height: auto; display: block; touch-action: none; }
    .controls { display: flex; flex-direction: column; gap: 10px; }
    .btn-group { display: flex; gap: 10px; justify-content: center; }
    button, .file-upload-label { background-color: #0d47a1; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }
    .secondary-btn { background-color: #cfd8dc; color: #263238; width: auto; flex: 1; }
    .download-btn { background-color: #1b5e20; }
    input[type="file"] { display: none; }
  </style>
</head>
<body>

  <div class="container">
    <h2>SYS MANNARKKAD ZONE</h2>
    <p>SNEHALOKAM</p>
    <div id="canvas-container">
      <canvas id="posterCanvas" width="1080" height="1080"></canvas>
    </div>
    <div class="controls">
      <div class="btn-group">
        <button type="button" class="secondary-btn" id="zoomInBtn">Zoom (+)</button>
        <button type="button" class="secondary-btn" id="zoomOutBtn">Zoom (-)</button>
      </div>
      <label class="file-upload-label" for="imageLoader">Select Photo</label>
      <input type="file" id="imageLoader" accept="image/*">
      <button type="button" class="download-btn" id="downloadBtn">Download Poster</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('posterCanvas');
    const ctx = canvas.getContext('2d');
    
    let frameImage = new Image();
    frameImage.crossOrigin = "anonymous";
    frameImage.src = 'frame.png.png';

    let userImage = null, userImgX = 0, userImgY = 0, scale = 0.5;
    let isDragging = false, lastX = 0, lastY = 0;

    function drawCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (userImage) ctx.drawImage(userImage, userImgX, userImgY, userImage.width * scale, userImage.height * scale);
      if (frameImage.complete) ctx.drawImage(frameImage, 0, 0, canvas.width, canvas.height);
    }

    frameImage.onload = () => drawCanvas();

    // Drag Logic (Mobile & Mouse)
    const startDrag = (x, y) => { isDragging = true; lastX = x; lastY = y; };
    const moveDrag = (x, y) => {
      if (!isDragging || !userImage) return;
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      userImgX += (x - lastX) * scaleX;
      userImgY += (y - lastY) * scaleY;
      lastX = x; lastY = y;
      drawCanvas();
    };

    // Mobile events
    canvas.addEventListener('touchstart', (e) => startDrag(e.touches[0].clientX, e.touches[0].clientY));
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); moveDrag(e.touches[0].clientX, e.touches[0].clientY); }, {passive: false});
    canvas.addEventListener('touchend', () => isDragging = false);

    // Mouse events
    canvas.addEventListener('mousedown', (e) => startDrag(e.clientX, e.clientY));
    window.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
    window.addEventListener('mouseup', () => isDragging = false);

    document.getElementById('imageLoader').addEventListener('change', (e) => {
      const reader = new FileReader();
      reader.onload = (event) => {
        userImage = new Image();
        userImage.onload = () => { scale = 0.5; userImgX = 200; userImgY = 200; drawCanvas(); };
        userImage.src = event.target.result;
      };
      reader.readAsDataURL(e.target.files[0]);
    });

    document.getElementById('zoomInBtn').onclick = () => { scale *= 1.1; drawCanvas(); };
    document.getElementById('zoomOutBtn').onclick = () => { scale /= 1.1; drawCanvas(); };
    document.getElementById('downloadBtn').onclick = () => {
      if(!userImage) { alert('ഫോട്ടോ സെലക്ട് ചെയ്യൂ!'); return; }
      const link = document.createElement('a');
      link.download = 'sys-poster.png'; link.href = canvas.toDataURL('image/png', 1.0); link.click();
    };
  </script>
</body>
</html>
