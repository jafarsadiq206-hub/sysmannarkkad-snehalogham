<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SYS Mannarkkad Snehalokam - Poster Generator</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-sizing: border-box;
    }
    h2 {
      margin-top: 0;
      color: #1a237e;
      font-size: 22px;
    }
    p {
      color: #555;
      font-size: 14px;
      margin-bottom: 20px;
    }
    #canvas-container {
      width: 100%;
      position: relative;
      background-color: #eee;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 15px;
      touch-action: none;
    }
    canvas {
      width: 100%;
      height: auto;
      display: block;
      cursor: grab;
    }
    canvas:active {
      cursor: grabbing;
    }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    button, .file-upload-label {
      background-color: #0d47a1;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      display: inline-block;
      transition: background-color 0.2s;
    }
    button:hover, .file-upload-label:hover {
      background-color: #1565c0;
    }
    .secondary-btn {
      background-color: #cfd8dc;
      color: #37474f;
    }
    .secondary-btn:hover {
      background-color: #b0bec5;
    }
    .download-btn {
      background-color: #2e7d32;
    }
    .download-btn:hover {
      background-color: #388e3c;
    }
    input[type="file"] {
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>SYS MANNARKKAD ZONE</h2>
    <p>SNEHALOKAM - Darul Furqan Thenkara</p>

    <div id="canvas-container">
      <canvas id="posterCanvas" width="1080" height="1080"></canvas>
    </div>

    <div class="controls">
      <div class="btn-group">
        <button type="button" class="secondary-btn" id="zoomInBtn">Zoom In (+)</button>
        <button type="button" class="secondary-btn" id="zoomOutBtn">Zoom Out (-)</button>
      </div>

      <label class="file-upload-label" for="imageLoader">Select Photo</label>
      <input type="file" id="imageLoader" accept="image/*">

      <button type="button" class="download-btn" id="downloadBtn">Download Poster</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('posterCanvas');
    const ctx = canvas.getContext('2d');
    const imageLoader = document.getElementById('imageLoader');
    const downloadBtn = document.getElementById('downloadBtn');
    const zoomInBtn = document.getElementById('zoomInBtn');
    const zoomOutBtn = document.getElementById('zoomOutBtn');

    let frameImage = new Image();
    frameImage.crossOrigin = "anonymous";
    frameImage.src = 'https://i.ibb.co/7xtTRpzP/png-sys-3.png';

    let userImage = null;
    let userImgX = 0;
    let userImgY = 0;
    let scale = 1;
    let isDragging = false;
    let startX = 0;
    let startY = 0;

    frameImage.onload = () => {
      drawCanvas();
    };

    imageLoader.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        userImage = new Image();
        userImage.onload = () => {
          scale = Math.max(canvas.width / userImage.width, canvas.height / userImage.height);
          userImgX = (canvas.width - userImage.width * scale) / 2;
          userImgY = (canvas.height - userImage.height * scale) / 2;
          drawCanvas();
        };
        userImage.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    function drawCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (userImage) {
        ctx.drawImage(
          userImage,
          userImgX,
          userImgY,
          userImage.width * scale,
          userImage.height * scale
        );
      }

      if (frameImage.complete && frameImage.naturalWidth !== 0) {
        ctx.drawImage(frameImage, 0, 0, canvas.width, canvas.height);
      }
    }

    // Drag Controls (Mouse)
    canvas.addEventListener('mousedown', (e) => {
      if (!userImage) return;
      isDragging = true;
      startX = e.offsetX;
      startY = e.offsetY;
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!isDragging || !userImage) return;
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;

      const dx = (e.offsetX - startX) * scaleX;
      const dy = (e.offsetY - startY) * scaleY;

      userImgX += dx;
      userImgY += dy;
      startX = e.offsetX;
      startY = e.offsetY;
      drawCanvas();
    });

    window.addEventListener('mouseup', () => { isDragging = false; });

    // Drag Controls (Touch)
    canvas.addEventListener('touchstart', (e) => {
      if (!userImage || e.touches.length !== 1) return;
      isDragging = true;
      const rect = canvas.getBoundingClientRect();
      startX = e.touches[0].clientX - rect.left;
      startY = e.touches[0].clientY - rect.top;
    });

    canvas.addEventListener('touchmove', (e) => {
      if (!isDragging || !userImage || e.touches.length !== 1) return;
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches[0].clientX - rect.left;
      const clientY = e.touches[0].clientY - rect.top;

      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;

      const dx = (clientX - startX) * scaleX;
      const dy = (clientY - startY) * scaleY;

      userImgX += dx;
      userImgY += dy;
      startX = clientX;
      startY = clientY;
      drawCanvas();
    }, { passive: false });

    window.addEventListener('touchend', () => { isDragging = false; });

    // Zoom Controls
    zoomInBtn.addEventListener('click', () => {
      if (!userImage) return;
      scale *= 1.1;
      drawCanvas();
    });

    zoomOutBtn.addEventListener('click', () => {
      if (!userImage) return;
      scale /= 1.1;
      drawCanvas();
    });

    // Download Handler
    downloadBtn.addEventListener('click', () => {
      if (!userImage) {
        alert('ദയവായി ആദ്യം ഒരു ഫോട്ടോ സെലക്ട് ചെയ്യുക!');
        return;
      }
      const link = document.createElement('a');
      link.download = 'sys-snehalokam-poster.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  </script>
</body>
</html>
