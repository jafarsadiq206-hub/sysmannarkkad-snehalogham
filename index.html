<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SYS Mannarkkad Snehalokam - Poster Generator</title>
  <style>
    body { font-family: sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    .container { background: #ffffff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 480px; width: 100%; text-align: center; }
    #canvas-container { width: 100%; touch-action: none; background-color: #eee; border-radius: 8px; overflow: hidden; margin-bottom: 15px; }
    canvas { width: 100%; height: auto; display: block; }
    .controls { display: flex; flex-direction: column; gap: 10px; }
    button, .file-upload-label { background-color: #0d47a1; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .secondary-btn { background-color: #cfd8dc; color: #37474f; }
    .download-btn { background-color: #2e7d32; }
    input[type="file"] { display: none; }
  </style>
</head>
<body>

  <div class="container">
    <h2>SYS MANNARKKAD ZONE</h2>
    <p>SNEHALOKAM</p>
    <div id="canvas-container">
      <canvas id="posterCanvas" width="1080" height="1080"></canvas>
    </div>
    <div class="controls">
      <div style="display:flex; gap:10px; justify-content:center;">
        <button class="secondary-btn" id="zoomInBtn">Zoom (+)</button>
        <button class="secondary-btn" id="zoomOutBtn">Zoom (-)</button>
      </div>
      <label class="file-upload-label" for="imageLoader">Select Photo</label>
      <input type="file" id="imageLoader" accept="image/*">
      <button class="download-btn" id="downloadBtn">Download Poster</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('posterCanvas');
    const ctx = canvas.getContext('2d');
    let frameImage = new Image(); frameImage.crossOrigin = "anonymous"; frameImage.src = 'frame.png.png';
    let userImage = null, userImgX = 0, userImgY = 0, scale = 1;
    let isDragging = false, lastX = 0, lastY = 0, initialPinchDist = 0;

    function drawCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (userImage) ctx.drawImage(userImage, userImgX, userImgY, userImage.width * scale, userImage.height * scale);
      if (frameImage.complete) ctx.drawImage(frameImage, 0, 0, canvas.width, canvas.height);
    }
    
    // Mouse Wheel Zoom
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoom = e.deltaY < 0 ? 1.1 : 0.9;
      scale *= zoom;
      drawCanvas();
    });

    // Touch/Mouse Events for Drag & Pinch
    canvas.addEventListener('pointerdown', (e) => { isDragging = true; lastX = e.clientX; lastY = e.clientY; });
    window.addEventListener('pointerup', () => { isDragging = false; initialPinchDist = 0; });
    canvas.addEventListener('pointermove', (e) => {
      if (!isDragging || !userImage) return;
      if (e.pointerType === 'touch' && e.isPrimary === false) { /* Pinch Logic */ }
      else {
        userImgX += (e.clientX - lastX) * (canvas.width / canvas.clientWidth);
        userImgY += (e.clientY - lastY) * (canvas.height / canvas.clientHeight);
        lastX = e.clientX; lastY = e.clientY;
        drawCanvas();
      }
    });

    document.getElementById('imageLoader').addEventListener('change', (e) => {
      const reader = new FileReader();
      reader.onload = (event) => {
        userImage = new Image(); userImage.onload = () => { scale = 1; userImgX = 0; userImgY = 0; drawCanvas(); };
        userImage.src = event.target.result;
      };
      reader.readAsDataURL(e.target.files[0]);
    });

    document.getElementById('zoomInBtn').onclick = () => { scale *= 1.1; drawCanvas(); };
    document.getElementById('zoomOutBtn').onclick = () => { scale /= 1.1; drawCanvas(); };
    document.getElementById('downloadBtn').onclick = () => {
      const link = document.createElement('a');
      link.download = 'sys-poster.png'; link.href = canvas.toDataURL('image/png', 1.0); link.click();
    };
  </script>
</body>
</html>
